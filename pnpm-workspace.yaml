packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # esbuild's postinstall links its platform binary; vitest needs it.
  # Unpacks the bundled Postgres server binaries used by `pnpm db:local`.
  '@embedded-postgres/darwin-arm64': true
  esbuild: true
  # Denied on purpose. This is the variant pulled on Linux CI and on Vercel's
  # build image, where `pnpm db:local` is never run — unpacking a Postgres
  # server there is pure cost. Left unlisted, pnpm fails the install outright
  # with ERR_PNPM_IGNORED_BUILDS rather than warning.
  '@embedded-postgres/linux-x64': false
  '@embedded-postgres/linux-arm64': false
  # Neither needs its postinstall. @google/genai is plain JS, and protobufjs's
  # script only matters for its CLI, which nothing here uses. Listing them
  # explicitly is not optional: pnpm fails an install outright on an unlisted
  # build script, which is what broke the Vercel deploy once already.
  '@google/genai': false
  protobufjs: false
